[project]
name = "piia-engram"
version = "3.39.0"
description = "One memory, every AI tool, yours to keep — your preferences, standards, and lessons follow you across Claude Code, Cursor, Codex, and any MCP tool. Local-first, no cloud, no account."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    {name = "Engram Contributors"},
]
keywords = ["ai", "identity", "mcp", "memory", "persistent-memory", "personal-knowledge", "llm", "context", "claude-code", "cursor", "codex", "mcp-server", "ai-agent", "local-first", "cross-tool", "cross-session", "developer-preferences", "user-profile", "knowledge-management", "vibe-coding"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mcp>=1.0",
    "portalocker>=2.0",
]

[project.urls]
Homepage = "https://github.com/Patdolitse/piia-engram"
Repository = "https://github.com/Patdolitse/piia-engram"
"Bug Tracker" = "https://github.com/Patdolitse/piia-engram/issues"

[project.scripts]
piia-engram = "piia_engram.setup_wizard:main"
# MCP server entry point — lets any client launch via `piia-engram-mcp` or
# `uvx --from piia-engram piia-engram-mcp` (zero pre-install), instead of
# `python -m ...`.
piia-engram-mcp = "piia_engram.mcp_server:main"
# Backward-compat alias — `engram` will be removed in a future major release.
engram = "piia_engram.setup_wizard:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "tomli>=2.0; python_version < \"3.11\"",
]
remote = [
    "uvicorn>=0.20",
]
secure = [
    "cryptography>=41.0",
]
# v4.0 hybrid search (optional): semantic vector layer on top of the
# zero-dep FTS5 index. ~230-280MB once the embedding model is fetched.
# Absent install => search_index falls back to FTS5 + keyword only.
vector = [
    "sqlite-vec>=0.1.0",
    "fastembed>=0.3.0",
]
all = [
    "uvicorn>=0.20",
    "cryptography>=41.0",
    "sqlite-vec>=0.1.0",
    "fastembed>=0.3.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
