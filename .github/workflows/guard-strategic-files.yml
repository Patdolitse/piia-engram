name: Guard strategic files

# CI checkpoint that blocks paths matching guard patterns from being
# tracked by git. Pairs with the project's release sanitization process
# (maintainer runbook: docs/internal/release-playbook.md, not published).
#
# Patterns are loaded from two sources, in this order:
#   1. The categorical patterns embedded below (public, kept minimal).
#   2. An optional `.guardignore` file (gitignored — see .gitignore).
#      When present, this file extends the pattern list with project-
#      specific paths. CI runners that don't have it just enforce the
#      categorical baseline.

on:
  push:
    branches: [main, "codex/**", "pre-release/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  guard:
    name: Block weakness-exposing files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2  # need HEAD + parent for "changed files" diff

      - name: Scan for blocked paths
        shell: bash
        run: |
          set -euo pipefail

          # Categorical patterns kept in-workflow (low information value
          # to outside readers — these are generic OSS hygiene buckets).
          patterns=(
            "experiments/*-private-*"
            "docs/internal/"
            "*-strategy.md"
            "*-strategy.html"
          )

          # Extension list — project-specific patterns live here, in a
          # gitignored file, so the workflow yaml stops broadcasting the
          # exact path shapes the project considers sensitive.
          if [ -f .guardignore ]; then
            while IFS= read -r line; do
              # skip blank lines and comments
              [ -z "$line" ] && continue
              case "$line" in \#*) continue ;; esac
              patterns+=("$line")
            done < .guardignore
            echo "[info] loaded $(grep -cve '^\s*$\|^\s*#' .guardignore) additional patterns from .guardignore"
          else
            echo "[info] no .guardignore present; running with categorical patterns only"
          fi

          hits=()
          for pat in "${patterns[@]}"; do
            while IFS= read -r f; do
              [ -n "$f" ] && hits+=("$f")
            done < <(git ls-files -- "$pat" 2>/dev/null || true)
          done

          if [ "${#hits[@]}" -eq 0 ]; then
            echo "[ok] no blocked files in tracked tree."
            exit 0
          fi

          echo "::error::Found ${#hits[@]} blocked path(s):"
          for f in "${hits[@]}"; do
            echo "  - $f"
          done
          echo ""
          echo "See CONTRIBUTING.md for the project's contribution guidelines."
          echo ""
          echo "Fix:"
          echo "  1. Move the file outside the repo (or to a gitignored path)"
          echo "  2. git rm <file>"
          echo "  3. Confirm .gitignore covers the pattern"
          echo "  4. Re-push"
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enforce publish allowlist (default-deny)
        shell: bash
        run: |
          # WHITELIST gate: every tracked file must be covered by an
          # entry in .publishallow, otherwise the build fails. This is
          # the inverse of the blacklist scan above — see
          # docs/internal/release-playbook.md §2.7 (maintainer runbook).
          python scripts/check_publish_allowlist.py
