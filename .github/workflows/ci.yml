name: CI

on:
  push:
    branches: [main, "codex/**", "pre-release/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  canonical-count:
    # C2 gate: ONE pinned environment produces the canonical test counts.
    # The real full-suite run must match docs/public-facts.json exactly;
    # compat matrix jobs never compare counts. Publish re-runs this gate.
    name: Canonical count gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev]" -c requirements.lock
      - name: Set up Node 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
      - name: Worker tests
        run: node worker/test/smoke.mjs && node worker/test/usage.mjs && node worker/test/session.mjs
      - name: Run full suite with JUnit output
        env:
          ENGRAM_TEST: "1"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PYTHONPATH: src
        run: |
          pytest tests/ -q -p no:cacheprovider \
            --junitxml=canonical-count.xml
      - name: Verify counts against public-facts manifest
        run: |
          set +e
          python scripts/check_canonical_counts.py canonical-count.xml \
            --patch-output canonical-count.patch
          rc=$?
          if [ -f canonical-count.patch ]; then
            echo "::notice::public-facts patch artifact generated (review + apply; the gate stays red until the manifest is refreshed)"
          fi
          exit $rc
      - name: Upload JUnit artifact
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: canonical-count-junit
          path: |
            canonical-count.xml
            canonical-count.patch

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Publish workflow order gate
        run: python scripts/check_publish_workflow_order.py

      - name: Install dependencies
        run: pip install -e ".[dev]" -c requirements.lock

      - name: CI-like pytest entrypoint gate
        run: python scripts/check_ci_pytest_entrypoint.py --discover-script-imports

      - name: Public fact sync gate
        run: python scripts/check_public_fact_sync.py

      - name: Public claim drift gate
        run: python scripts/check_public_claim_drift.py

      - name: Public trust claim gate
        run: python scripts/check_public_trust_claims.py

      - name: Public reference truth gate
        run: python scripts/check_public_reference_truth.py

      - name: Release version-consistency preflight
        run: python scripts/check_release_preflight.py

      - name: Pre-release sanitization scan
        run: python scripts/release_sanitize_check.py --internal --strict

      - name: Worker public config gate
        run: python scripts/check_worker_public_config.py

      - name: Export redaction sample gate
        run: python scripts/check_export_redaction.py --strict docs/samples/export-redaction-clean-sample.md

      - name: Generated export redaction gate
        run: python scripts/check_generated_export_redaction.py

      - name: Embedded facade contract manifest guard
        run: python scripts/check_embedded_contract.py

      - name: Embedded capability witness guard
        run: python scripts/generate_capability_witness.py --verify docs/embedded/capability-witness.json

      - name: Memory eval suite gate
        run: python scripts/run_memory_evals.py --json

      - name: Run tests
        run: pytest tests/ -q

  test-compat:
    name: Compat (${{ matrix.os }}, Python 3.12)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Publish workflow order gate
        run: python scripts/check_publish_workflow_order.py

      - name: Install dependencies
        run: pip install -e ".[dev]" -c requirements.lock

      - name: CI-like pytest entrypoint gate
        run: python scripts/check_ci_pytest_entrypoint.py --discover-script-imports

      - name: Public fact sync gate
        run: python scripts/check_public_fact_sync.py

      - name: Public claim drift gate
        run: python scripts/check_public_claim_drift.py

      - name: Public trust claim gate
        run: python scripts/check_public_trust_claims.py

      - name: Public reference truth gate
        run: python scripts/check_public_reference_truth.py

      - name: Release version-consistency preflight
        run: python scripts/check_release_preflight.py

      - name: Pre-release sanitization scan
        run: python scripts/release_sanitize_check.py --internal --strict

      - name: Worker public config gate
        run: python scripts/check_worker_public_config.py

      - name: Export redaction sample gate
        run: python scripts/check_export_redaction.py --strict docs/samples/export-redaction-clean-sample.md

      - name: Generated export redaction gate
        run: python scripts/check_generated_export_redaction.py

      - name: Embedded facade contract manifest guard
        run: python scripts/check_embedded_contract.py

      - name: Embedded capability witness guard
        run: python scripts/generate_capability_witness.py --verify docs/embedded/capability-witness.json

      - name: Memory eval suite gate
        run: python scripts/run_memory_evals.py --json

      - name: Run tests
        run: pytest tests/ -q

  test-extras:
    # The main `test` matrix installs only `.[dev]` to prove the core works with
    # zero extras (deps are just mcp + portalocker). That leaves the optional
    # surfaces — field/corpus encryption ([secure]), the local Dock GUI ([ui]),
    # and the self-contained web reader ([reader]) — exercised ONLY when their
    # extra is installed: their tests importorskip / HAS_CRYPTO-gate, so under
    # `.[dev]` they silently skip. This job installs those extras so those suites
    # actually run in CI. (remote/SSE + vector are deferred on purpose —
    # local-first focus + heavy model download.)
    name: Test extras (secure + ui + reader)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies (with secure + ui + reader extras)
        run: pip install -e ".[dev,secure,ui,reader]" -c requirements.lock

      - name: Run tests (crypto + Dock GUI + reader suites now execute, not skip)
        run: pytest tests/ -q

  supply-chain-dryrun:
    name: Supply-chain dry run
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build==1.5.0 twine==6.2.0 -c requirements.lock

      - name: Build package
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check --strict dist/*.whl dist/*.tar.gz

      - name: Generate CycloneDX SBOM
        run: |
          python -m venv .sbom-target-venv
          .sbom-target-venv/bin/python -m pip install dist/*.whl -c requirements.lock
          pip install cyclonedx-bom==7.3.0 -c requirements.lock
          cyclonedx-py environment .sbom-target-venv/bin/python --pyproject pyproject.toml --mc-type library --output-reproducible --output-format JSON --output-file dist/piia-engram-sbom.cdx.json
          # --output-reproducible omits serialNumber, but actions/attest requires
          # it; inject a content-derived (still reproducible) one.
          python scripts/inject_sbom_serial_number.py dist/piia-engram-sbom.cdx.json

      - name: SBOM hygiene gate
        run: python scripts/check_sbom_hygiene.py dist/piia-engram-sbom.cdx.json

      - name: Dependency vulnerability scan
        run: |
          pip install pip-audit -c requirements.lock
          pip-audit --strict --desc on 2>&1 || true

      - name: Publish workflow order gate
        run: python scripts/check_publish_workflow_order.py

      - name: Upload supply-chain dry-run artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: supply-chain-dryrun-artifacts
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/piia-engram-sbom.cdx.json

  release-commit-guard:
    # If a commit BUMPS the package version, it must also carry its
    # release-evidence/v<version>.md in the SAME commit/tree. This makes the
    # v4.10.0 failure mode (tag created without committed evidence) structurally
    # impossible: by the time main HEAD has version V, the evidence is already
    # in that commit, so tagging HEAD can never miss it. No-bump commits pass
    # trivially. Stdlib-only — no project install needed.
    name: Release commit guard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Version bump must ship its release evidence
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/check_release_preflight.py --since "$BASE_SHA" --base-required
