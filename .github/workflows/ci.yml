name: CI

on:
  push:
    branches: [main, "codex/**", "pre-release/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Publish workflow order gate
        run: python scripts/check_publish_workflow_order.py

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: CI-like pytest entrypoint gate
        run: python scripts/check_ci_pytest_entrypoint.py --discover-script-imports

      - name: Public fact sync gate
        run: python scripts/check_public_fact_sync.py

      - name: Public claim drift gate
        run: python scripts/check_public_claim_drift.py

      - name: Public trust claim gate
        run: python scripts/check_public_trust_claims.py

      - name: Pre-release sanitization scan
        run: python scripts/release_sanitize_check.py --internal --strict

      - name: Worker public config gate
        run: python scripts/check_worker_public_config.py

      - name: Export redaction sample gate
        run: python scripts/check_export_redaction.py --strict docs/samples/export-redaction-clean-sample.md

      - name: Generated export redaction gate
        run: python scripts/check_generated_export_redaction.py

      - name: Memory eval suite gate
        run: python scripts/run_memory_evals.py --json

      - name: Run tests
        run: pytest tests/ -q

  test-compat:
    name: Compat (${{ matrix.os }}, Python 3.12)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Publish workflow order gate
        run: python scripts/check_publish_workflow_order.py

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: CI-like pytest entrypoint gate
        run: python scripts/check_ci_pytest_entrypoint.py --discover-script-imports

      - name: Public fact sync gate
        run: python scripts/check_public_fact_sync.py

      - name: Public claim drift gate
        run: python scripts/check_public_claim_drift.py

      - name: Public trust claim gate
        run: python scripts/check_public_trust_claims.py

      - name: Pre-release sanitization scan
        run: python scripts/release_sanitize_check.py --internal --strict

      - name: Worker public config gate
        run: python scripts/check_worker_public_config.py

      - name: Export redaction sample gate
        run: python scripts/check_export_redaction.py --strict docs/samples/export-redaction-clean-sample.md

      - name: Generated export redaction gate
        run: python scripts/check_generated_export_redaction.py

      - name: Memory eval suite gate
        run: python scripts/run_memory_evals.py --json

      - name: Run tests
        run: pytest tests/ -q

  test-extras:
    # The main `test` matrix installs only `.[dev]` to prove the core works with
    # zero extras (deps are just mcp + portalocker). That leaves the optional
    # surfaces — field/corpus encryption ([secure]) and the local Dock GUI
    # ([ui]) — exercised ONLY when their extra is installed: their tests
    # importorskip / HAS_CRYPTO-gate, so under `.[dev]` they silently skip. This
    # job installs those extras so those suites actually run in CI. (remote/SSE +
    # vector are deferred on purpose — local-first focus + heavy model download.)
    name: Test extras (secure + ui)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies (with secure + ui extras)
        run: pip install -e ".[dev,secure,ui]"

      - name: Run tests (crypto + Dock GUI suites now execute, not skip)
        run: pytest tests/ -q

  supply-chain-dryrun:
    name: Supply-chain dry run
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Generate CycloneDX SBOM
        run: |
          python -m venv .sbom-target-venv
          .sbom-target-venv/bin/python -m pip install dist/*.whl
          pip install cyclonedx-bom
          cyclonedx-py environment .sbom-target-venv/bin/python --pyproject pyproject.toml --mc-type library --output-reproducible --output-format JSON --output-file dist/piia-engram-sbom.cdx.json
          # --output-reproducible omits serialNumber, but actions/attest requires
          # it; inject a content-derived (still reproducible) one.
          python scripts/inject_sbom_serial_number.py dist/piia-engram-sbom.cdx.json

      - name: SBOM hygiene gate
        run: python scripts/check_sbom_hygiene.py dist/piia-engram-sbom.cdx.json

      - name: Publish workflow order gate
        run: python scripts/check_publish_workflow_order.py

      - name: Upload supply-chain dry-run artifacts
        uses: actions/upload-artifact@v4
        with:
          name: supply-chain-dryrun-artifacts
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/piia-engram-sbom.cdx.json
