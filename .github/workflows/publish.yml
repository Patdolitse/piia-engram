name: Publish to PyPI

on:
  release:
    types: [published]
# NOTE: workflow_dispatch intentionally removed. Manual dispatch can run
# from an arbitrary ref, which (without environment branch protection) would
# let an unreviewed branch/tag carry a no-op release gate or forged
# evidence and still publish. Publishing is allowed ONLY via a published
# GitHub Release whose commit is verified to be on main (see step below).
# Pair this with a GitHub Environment ("pypi") deployment-branch rule.

permissions:
  contents: read
  id-token: write  # Required for PyPI Trusted Publishing (OIDC)
  attestations: write
  artifact-metadata: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # full history so the on-main ancestry check works

      - name: Verify release commit is on main
        run: |
          git fetch origin main --quiet
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::release commit $GITHUB_SHA is NOT an ancestor of origin/main; refusing to publish."
            exit 1
          fi
          echo "[ok] release commit is on main."

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Publish workflow order gate
        run: python scripts/check_publish_workflow_order.py

      - name: Install project dependencies for release gates
        run: pip install -e ".[dev]"

      - name: Public fact sync gate
        run: python scripts/check_public_fact_sync.py

      - name: Public claim drift gate
        run: python scripts/check_public_claim_drift.py

      - name: Public trust claim gate
        run: python scripts/check_public_trust_claims.py

      - name: Export redaction sample gate
        run: python scripts/check_export_redaction.py --strict docs/samples/export-redaction-clean-sample.md

      - name: Generated export redaction gate
        run: python scripts/check_generated_export_redaction.py

      - name: Embedded facade contract guard
        run: |
          python scripts/check_embedded_contract.py
          python scripts/generate_capability_witness.py --verify docs/embedded/capability-witness.json

      - name: Memory eval suite gate
        run: python scripts/run_memory_evals.py --json

      - name: Release gate (no publish without review evidence)
        run: python scripts/check_release_gate.py

      - name: Pre-release sanitization scan (internal disclosure blocks publish)
        run: python scripts/release_sanitize_check.py --internal --strict

      - name: Canonical count gate (release re-run)
        run: |
          pip install -e ".[dev]"
          ENGRAM_TEST=1 PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 PYTHONPATH=src \
            pytest tests/ -q -p no:cacheprovider --junitxml=canonical-count.xml
          python scripts/check_canonical_counts.py canonical-count.xml
      - name: Install build tools
        run: pip install build==1.5.0

      - name: Build package
        run: python -m build

      - name: Release artifact private-term scan
        run: python scripts/check_release_artifact_private_terms.py dist --strict

      - name: Generate CycloneDX SBOM
        run: |
          python -m venv .sbom-target-venv
          .sbom-target-venv/bin/python -m pip install dist/*.whl
          pip install cyclonedx-bom==7.3.0
          cyclonedx-py environment .sbom-target-venv/bin/python --pyproject pyproject.toml --mc-type library --output-reproducible --output-format JSON --output-file dist/piia-engram-sbom.cdx.json
          # --output-reproducible omits serialNumber, but actions/attest requires
          # it; inject a content-derived (still reproducible) one.
          python scripts/inject_sbom_serial_number.py dist/piia-engram-sbom.cdx.json

      - name: SBOM hygiene gate
        run: python scripts/check_sbom_hygiene.py dist/piia-engram-sbom.cdx.json

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz

      - name: Attest SBOM
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
          sbom-path: dist/piia-engram-sbom.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: dist/piia-engram-sbom.cdx.json

      # gh-action-pypi-publish uploads every file in dist/ and rejects
      # non-distribution files; the SBOM is already attested and uploaded
      # as a workflow artifact above.
      - name: Remove SBOM from dist before publish
        run: rm dist/piia-engram-sbom.cdx.json

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # Pure OIDC Trusted Publishing: configure the PyPI project to trust
        # repo Patdolitse/piia-engram, workflow publish.yml, environment pypi.
        # Do not pass username/password or long-lived API tokens here.
        with:
          skip-existing: true
